# =====================================================
# Black - автоматическое форматирование Python-кода
# =====================================================

[tool.black]

# Максимальная длина строки
# Стандарт Black — 88 символов
line-length = 88

# Версия Python проекта
target-version = ["py312"]


# =====================================================
# Ruff - проверка качества кода
# =====================================================

[tool.ruff]

# Длина строки должна совпадать с Black
line-length = 88

# Версия Python
target-version = "py312"


# Какие проверки включаем
[tool.ruff.lint]

select = [
    "E", # Ошибки форматирования (pycodestyle)
    "F", # Неиспользуемые импорты, переменные и ошибки
    "I", # Сортировка импортов (isort)
    "B", # Поиск потенциальных багов
    "UP", # Современный синтаксис Python
]

ignore = []

# Настройка форматирования Ruff
[tool.ruff.format]

# Используем двойные кавычки
quote-style = "double"


# =====================================================
# isort - сортировка импортов
# =====================================================

[tool.isort]

# Совместимость с Black
profile = "black"

# Такая же длина строк
line_length = 88


# =====================================================
# mypy - строгая проверка типов Python
# =====================================================

[tool.mypy]

# Версия Python
python_version = "3.12"

# Максимально строгий режим
strict = true

# Предупреждать о возвращаемом Any
warn_return_any = true

# Предупреждать о неправильных настройках
warn_unused_configs = true


# Не проверять миграции Django
exclude = [
    "migrations",
    ".venv",
]


# =====================================================
# Pyright - дополнительная проверка типов
# =====================================================

[tool.pyright]

# Версия Python
pythonVersion = "3.12"

# Строгая проверка типов
typeCheckingMode = "strict"


exclude = [
    "**/migrations",
    ".venv",
]